name: flash_rejected_delegation_preserves_parent_tools
description: |
  Rejected delegation must preserve independent parent catalog work without
  starting a substitute child.
prompt: |
  只尝试一次委派，让 glm-99.99 模型的子代理回答 ASTRA-MISSING-MODEL-MUST-NOT-RUN。
  使用 requested_model_policy={"mode":"fixed","selector":{"kind":"configured_name","model_name":"glm-99.99"}}，不要设置 execution 或其他模型字段。
  这是一条模型 admission 负向测试，spawn 参数必须合法。使用以下完整参数：
  {"action":"spawn","description":"Check unavailable model","prompt":"Reply ASTRA-MISSING-MODEL-MUST-NOT-RUN","requested_model_policy":{"mode":"fixed","selector":{"kind":"configured_name","model_name":"glm-99.99"}}}
  子任务指令放在 prompt；不要添加 message、message_type、to 或 agent_id，
  这些是其他 action 的字段，会在模型检查之前导致参数校验失败。
  若委派失败，不要重试或换模型。之后由当前代理调用 model_catalog 查询当前可用的 Chat 模型，
  使用这次真实返回的目录结果，如实告诉我委派结果及可用模型。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    root_only: true
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    ok: false
    root_only: true
    predicates:
      - document: arguments
        path: /action
        equals: spawn
      - document: arguments
        path: /requested_model_policy
        equals: {mode: fixed, selector: {kind: configured_name, model_name: glm-99.99}}
      - document: result
        path: /status
        equals: failed
  - type: any_of
    criteria:
      - type: execution_tool_count
        name: agent
        min: 1
        max: 1
        root_only: true
        ok: false
        predicates:
          - {document: arguments, path: /action, equals: spawn}
          - {document: result, path: /error_kind, equals: invalid_request}
          - {document: result, path: /executed, equals: false}
      - type: execution_tool_count
        name: agent
        min: 1
        max: 1
        root_only: true
        ok: false
        predicates:
          - {document: arguments, path: /action, equals: spawn}
          - {document: result, path: /error_kind, equals: delegation_model_scope_unresolved}
          - {document: result, path: /advisory/executed, equals: false}
  - type: execution_child_count
    min: 0
    max: 0
  - type: execution_tool_count
    name: reflect
    min: 0
    max: 0
  - type: execution_tool_count
    name: model_catalog
    min: 1
    max: 4294967295
    root_only: true
    ok: true
    predicates:
      - document: result
        path: /purpose
        equals: chat
  - type: execution_tool_sequence
    tools: [agent, model_catalog]
    last_ok: true
    require_settled: true
  - type: hard_judger
    threshold: 0.85
    question: |
      Does the final answer clearly explain the failed requested delegation
      and give a useful report about available Chat models from the parent task?
      Require a useful answer to both parts, without claiming the unavailable
      child ran or a substitute model was used. No marker, exact wording, or
      preliminary catalog query is required. The deterministic execution checks
      separately require an actual rejected spawn, zero children, and a successful
      catalog request emitted after that rejection settled; prose cannot replace
      those checks. Judge user-facing completeness here, not exact catalog
      membership: the catalog body is not included in this judge input.
