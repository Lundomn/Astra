name: multi_turn_local_followup_focus
description: |
  **What**: Change topics inside one session, ask an elliptical summary question, then explicitly
  widen scope back to the old topic.
  **Tests**: Immediate-exchange referent resolution, resistance to stale session-memory salience,
  and an explicit session-wide scope override.
  **Why**: Short follow-ups such as “问题总结？” must summarize the immediately preceding review,
  not whichever older topic occupies more tokens in history or session memory.
  **Pass means**: The local follow-up stays on CURSOR-BETA, while the explicit session-wide recall
  still recovers LEGACY-ALPHA. The initial response acknowledges the supplied fact; a brief,
  truthful clarification of conversational scope is not a claim of durable storage.
  **Fail means**: An older salient topic hijacks the local follow-up, or local-focus protection
  prevents a later explicit broad-scope request.
prompt: |
  我们先讨论一个旧事故：代号 LEGACY-ALPHA。它涉及动态 task board 的取消与追加。
  只需确认你记住了事故代号，不要使用工具。
prompt_variants:
  - id: zh_local_paraphrase
    step_index: 1
    prompt: "刚才的问题概括？请用一句话回答，不要使用工具。"
  - id: en_local_paraphrase
    step_index: 1
    prompt: "Issue summary? Answer in one sentence and do not use tools."
models:
  - deepseek-v4-flash
capability: "custom:multi_turn_local_followup_focus"
difficulty: 4
weight: 3.0
timeout_seconds: 180
steps:
  - prompt: |
      现在切换话题。刚完成的只读 review 结论代号是 CURSOR-BETA：
      分页排序与 continuation cursor 不一致，并且缺少对应负例测试。
      请用一句话复述这条已给出的结论，不要使用工具。
    criteria:
      - type: text_contains
        needle: CURSOR-BETA
  - prompt: "问题总结？请用一句话回答，不要使用工具。"
    criteria:
      - type: hard_judger
        question: |
          Is the answer a direct, concise summary of the immediately preceding CURSOR-BETA
          review finding (cursor inconsistency and missing negative test), without drifting to
          the older LEGACY-ALPHA topic or inventing runtime/tool evidence? Both findings must
          be present. Accept equivalent wording in any language, including translations of
          cursor and negative tests. Mentioning the old topic solely to contrast it with the
          current finding is not topic hijacking. Reject a missing finding, actual stale-topic
          substitution, or fabricated evidence. Judge meaning rather than literal substrings;
          verbosity alone is not a hard failure. If the evidence is insufficient, answer unknown.
        threshold: 0.8
  - prompt: "现在明确回到整个 session：最早讨论的旧事故代号是什么？只回答代号。"
    criteria:
      - type: text_contains
        needle: LEGACY-ALPHA
criteria:
  - type: exit_code
    code: 0
  - type: text_contains
    needle: LEGACY-ALPHA
  - type: turn_rounds_between
    min: 1
    max: 5
  - type: hard_judger
    question: |
      Review the complete ordered assistant transcript. In the response to the initial user
      message, did the assistant acknowledge the newly supplied LEGACY-ALPHA fact for this
      conversation without denying it, substituting another topic, or using tools? The user
      supplied the fact directly: absent historical records are not a reason to refuse
      acknowledgment or demand a lookup. Reject unsupported claims of retrieval, persistence,
      prior history, or a durable-memory promise; a statement that no persistence or tool use
      occurred does not assert such an action. Accept a brief truthful clarification that the
      fact is understood within this conversation or was not saved durably, when it does not
      negate the acknowledgment. Judge meaning, not exact words or formatting. Verbosity alone
      is not a hard semantic failure. Later correct turns cannot repair a genuine initial
      violation. If the initial response or the evidence needed to judge it is missing, answer
      unknown rather than infer it from later correctness.
    threshold: 0.8
