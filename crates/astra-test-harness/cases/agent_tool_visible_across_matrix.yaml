name: agent_tool_visible_across_matrix
description: |
  **What**: Run the canonical agent surface and verify the selected model can discover and use it.
  **Tests**: Agent tool visibility plus lossless child-result transport.
  **Why**: G3 regression for a bug where the agent tool had no surface entry, making it invisible to some models; the fix must work across all families.
  **Pass means**: The selected model discovers the agent tool, receives a completed child
  result, and surfaces the marker; child punctuation remains provider data.
  **Fail means**: Tool surface regression — `agent` is hidden from one or more model families.
prompt: |
  Use the `agent` tool with action `spawn` to start exactly one child:
    description: "G3 matrix child"
    prompt: "Say the exact text: G3-matrix-ok. Do not use any tools, just reply with that text."
    agent_type: "general-purpose"

  Surface the child's exact reply in your final answer.
models:
  - deepseek-v4-flash
  - us.anthropic.claude-sonnet-4-6
  - MiniMax-M2.7
timeout_seconds: 180
debug_log: true
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    document: arguments
    path: /action
    equals: spawn
  - type: journal_tool_json
    name: agent
    document: result
    path: /status
    equals: launched
  - type: journal_tool_json
    name: agent
    document: result
    path: /result_family
    equals: control_receipt
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
  - type: session_event_count
    event_type: agent_terminated
    min: 1
    max: 1
    json_match:
      path: /metadata/status
      equals: completed
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: session_child_result_adopted
    expected_result: "G3-matrix-ok"
  - type: tools_count_between
    min: 1
    max: 4
  - type: text_contains
    needle: "G3-matrix-ok"
