name: work_two_step_execution_journey
description: |
  **What**: Explicitly request durable tracking and delivery of two independent,
  source-backed repository checks in ordinary product language.
  **Tests**: Requested Work establishment, live execution of both items, durable settlement,
  and bounded model/tool churn without relying on task names or response prose.
  **Why**: A task list that is only created or only visible after completion is not a usable
  product. This is deliberately distinct from the planning-only journey: it fails unless
  the same user turn establishes Work and carries both independently meaningful items to a
  truthful terminal state.
  **Pass means**: Semantic admission creates one two-item canonical Work graph before
  primary execution, then the primary model executes and settles both items without asking
  the user to make routine decomposition decisions.
  **Fail means**: Astra returns a prose checklist, leaves a created item unfinished, creates
  duplicate Work, or spins through excessive model/tool rounds.
  Inputs use an isolated fixture: this measures Work execution, not research
  across Astra's independently evolving CI lanes.
prompt: |
  Create a durable Work board to track these two tasks separately, execute both now,
  and record their delivery so I can inspect or continue this Work in a later session.
  Work only within `target/astra-harness-work-journey`. Before a release handoff,
  independently verify two things in that repository fixture:
  first, identify the CI command that runs the test suite; second, identify the local
  developer command intended to run the corresponding check. Cite the source paths and
  report the exact commands you find. Use read_file to inspect its
  `.github/workflows/check.yml` and `Makefile` as the respective source evidence.
  Do the verification now and avoid asking me to approve routine decomposition.
models:
  - deepseek-v4-flash
capability: "custom:work_two_step_execution_journey"
difficulty: 4
weight: 3.0
timeout_seconds: 180
debug_log: true
setup_cmd: |
  set -euC
  test ! -L target
  mkdir -p target
  mkdir target/astra-harness-work-journey
  cd target/astra-harness-work-journey
  mkdir -p .github/workflows scripts
  printf 'name: Fixture check\non: [push]\njobs:\n  check:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: bash scripts/check.sh\n' > .github/workflows/check.yml
  printf '.PHONY: verify\nverify:\n\tbash scripts/check.sh\n' > Makefile
  printf '#!/usr/bin/env bash\nset -eu\nprintf "check passed\\n"\n' > scripts/check.sh
  # Fail rather than overwrite prior files; the isolated workspace owner cleans up.
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: start_work
  - type: journal_tool_call_count
    name: start_work
    min: 1
    max: 1
  # A durable two-item Work request has a single canonical execution carrier.
  # Fanout is a different typed product mode; allowing it here would hide an
  # admission race behind a superficially successful result.
  - type: journal_tool_call_count
    name: agent_fanout
    min: 0
    max: 0
  - type: journal_tool_json
    name: start_work
    document: arguments
    path: /activation
    equals: start
  - type: journal_tool_json
    name: start_work
    document: result
    path: /initial_item_count
    equals: 2
  # The live board is a typed projection of the same server allocation.  Its
  # receipt must be present before execution; prose or a post-hoc checklist is
  # not a substitute for a usable task view.
  - type: journal_tool_json
    name: start_work
    document: result
    path: /task_board_update/schema_version
    equals: 1
  - type: journal_tool_sequence
    tools:
      - start_work
      - settle_work_item
      - settle_work_item
  - type: journal_tool_call_count
    name: settle_work_item
    min: 2
    max: 2
  - type: journal_tool_call_count
    name: settle_work_item
    ok: false
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: settle_work_item
    min: 2
    max: 2
    document: result
    path: /task_board_update/schema_version
    equals: 1
  - type: journal_work_item_execution_from_start
    min_distinct_items: 2
  - type: journal_tool_call_count
    name: settle_work_item
    min: 2
    max: 2
    ok: true
    document: result
    path: /outcome
    equals: delivered
  - type: journal_tool_json_contains
    name: read_file
    document: result
    path: ""
    contains: "- run: bash scripts/check.sh"
  - type: journal_tool_json_contains
    name: read_file
    document: result
    path: ""
    contains: ".PHONY: verify"
  - type: journal_tool_call_count
    name: read_file
    ok: true
    min: 2
    # Full count representation, not an arbitrary efficiency ceiling.
    max: 4294967295
  - type: hard_judger
    threshold: 0.85
    question: |
      Does the final answer accurately report both source-backed fixture checks?
      The workflow source is .github/workflows/check.yml and its check command is
      bash scripts/check.sh. The local source is Makefile and its verify target
      runs that same script. Accept semantically equivalent invocations such as
      make verify from the fixture directory, make -C <fixture> verify, or a cd
      followed by make verify. Require both source paths and commands, and a
      concise completion report. Do not require literal wording or formatting.
      The durable journal separately proves both Work items were delivered;
      prose cannot replace that evidence.
  - type: journal_tool_call_count
    name: ask_user
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: enter_plan_mode
    min: 0
    max: 0
  - type: tools_count_between
    min: 4
    max: 16
  - type: turn_rounds_between
    min: 3
    max: 10
  - type: duration_between
    min_ms: 0
    max_ms: 120000
  - type: all_of
    criteria:
      - type: pipeline_alert_count
        rule: prompt_cache_break
        max: 0
